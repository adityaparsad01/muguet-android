plugins {
    id 'com.android.application'
}

android {
    namespace 'com.c22dev.muguet.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.c22dev.muguet.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-android'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
